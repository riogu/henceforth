name: Rust hfs-assert

on:
  push:
    branches: [ "hfs-assert" ]
  pull_request:
    branches: [ "hfs-assert" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo t --verbose

