[package]
name = "henceforth"
version = "1.0.2"
edition = "2024"
description = "A statically-typed stack-based programming language with an imperative twist."
license = "GPL-2.0-or-later"
repository = "https://github.com/riogu/henceforth"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
slotmap = { version = "1.0" }
indexmap  = { version = "2.13" }
colored = "3.1.1"
cranelift-codegen = { version = "0.128.4", optional = true }
cranelift-frontend = { version = "0.128.4", optional = true }
cranelift-module = { version = "0.128.4", optional = true }
cranelift-object = { version = "0.128.4", optional = true }
cranelift-native = { version = "0.128.4", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
libtest-mimic = "0.8.2"

[lib]
name = "henceforth"
path = "src/lib.rs"

[[test]]
name = "error_tests"
path = "tests/error_tests.rs"
harness = false

[[test]]
name = "opt_tests"
path = "tests/opt_tests.rs"
harness = false

[[test]]
name = "compile_tests"
path = "tests/compile_tests.rs"
harness = false

[[test]]
name = "backend_parity_tests"
path = "tests/backend_parity_tests.rs"
harness = false

[features]
default = ["cranelift"]
cranelift = [
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-module",
  "dep:cranelift-object",
  "dep:cranelift-native",
]
